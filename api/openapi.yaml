openapi: 3.1.0
info:
  title: SERK Construction — Financial Kernel API
  version: 0.2.0-gate-a
  description: |
    Deterministic financial kernel of SERK Construction. Every command is
    authorised server-side, committed in one PostgreSQL transaction, audited
    and published to the transactional outbox. AI components never call this
    API with write authority (LAW 02).

    Step-up: operations marked "MFA" require a token whose `amr` asserts a
    multi-factor method and whose `auth_time` is at most 10 minutes old;
    otherwise the API answers 401 with
    `WWW-Authenticate: Bearer error="insufficient_user_authentication"` (RFC 9470).

    Mandatory workflows: when a mandatory workflow is published for journals,
    FX rates or fiscal periods, the direct approve/post/close endpoints answer
    409 `workflow_required`; the transition then happens only as the effect of
    a workflow step decided by an authorised person (`/v1/workflow/...`).
servers:
  - url: https://api.example.serk/
security:
  - bearerAuth: []
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?[0-9]{1,18}(\.[0-9]{1,6})?$', description: Plain decimal string in the currency's minor units; exponent notation or extra decimals are rejected, never rounded }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Line:
      type: object
      required: [account_id, side, amount]
      properties:
        account_id: { type: string, format: uuid }
        side: { type: string, enum: [DEBIT, CREDIT] }
        amount: { $ref: '#/components/schemas/Money', description: Functional-currency amount, positive }
        txn_amount: { $ref: '#/components/schemas/Money', description: Original foreign-currency amount; requires fx_snapshot_id, and amount must equal round_half_even(txn_amount × snapshot rate) }
        fx_snapshot_id: { type: string, format: uuid, description: Must be APPROVED and of the pair txn_currency/functional_currency (or its inverse) }
        applied_rate: { type: string, readOnly: true, description: Functional units per one transaction unit, bound by the kernel }
        project_id: { type: string, format: uuid }
        cost_code_id: { type: string, format: uuid }
        memo: { type: string, maxLength: 500 }
    JournalCommand:
      type: object
      required: [legal_entity_id, functional_currency, business_event_at, description, source_type, idempotency_key, lines]
      additionalProperties: false
      properties:
        legal_entity_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        functional_currency: { type: string, pattern: '^[A-Z]{3}$' }
        business_event_at: { type: string, format: date-time, description: Accounting date of the event (UTC), not server time }
        description: { type: string, maxLength: 2000 }
        source_type: { type: string, example: MANUAL }
        source_ref: { type: string }
        idempotency_key: { type: string, maxLength: 128, description: Client-generated; replays return the original journal }
        lines: { type: array, minItems: 2, maxItems: 10000, items: { $ref: '#/components/schemas/Line' } }
    Journal:
      allOf:
        - $ref: '#/components/schemas/JournalCommand'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [DRAFT, APPROVED, POSTED, REVERSED, CANCELLED] }
            created_by: { type: string }
            approved_by: { type: string }
            posted_by: { type: string }
            reversal_of: { type: string, format: uuid }
            reversed_by: { type: string, format: uuid }
            version: { type: integer }
    Reason:
      type: object
      additionalProperties: false
      properties: { reason: { type: string, minLength: 5 } }
    WorkflowDefinition:
      type: object
      additionalProperties: false
      required: [key, title, subject, start_permission, steps]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_.]{2,60}$' }
        title: { type: string }
        subject: { type: string, enum: [journal, fx_snapshot, fiscal_period] }
        mandatory: { type: boolean, description: When published, the direct API and database path for the subject's sensitive transitions is closed; must perform every sensitive transition of the subject }
        start_permission: { type: string }
        on_reject: { type: string, description: Non-sensitive compensation effect (journal.cancel, fx.reject) }
        steps:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [id, title, permission]
            properties:
              id: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
              title: { type: string }
              permission: { type: string }
              approvals: { type: integer, minimum: 1, maximum: 5, default: 1, description: Quorum of distinct approvers (parallel approval) }
              distinct_from: { type: array, items: { type: string }, description: 'initiator, subject.creator, or step:<earlier step id>. A step with a sensitive effect must list subject.creator and every earlier sensitive step.' }
              require_mfa: { type: boolean }
              when:
                type: array
                description: Journal subjects only. One threshold per currency (exact amount in that currency's minor units); the step applies when the journal's functional-currency total is at or above the threshold of its currency. A journal in a currency without a threshold cannot be routed (fail closed).
                items: { type: object, additionalProperties: false, required: [amount_gte, currency], properties: { amount_gte: { type: string }, currency: { type: string } } }
              sla: { type: string, example: 24h, pattern: '^([0-9]{1,4}h)?([0-9]{1,6}m)?([0-9]{1,8}s)?$' }
              escalate_to: { type: string, description: Permission whose holders are notified at SLA breach (notification only) }
              expire_after: { type: string, example: 168h, pattern: '^([0-9]{1,4}h)?([0-9]{1,6}m)?([0-9]{1,8}s)?$' }
              effect: { type: string, enum: [journal.approve, journal.post, journal.cancel, fx.approve, fx.reject, period.close] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [unauthenticated, forbidden, not_found, validation, invalid_state, segregation_of_duties,
                     idempotency_conflict, version_conflict, invariant_violation, fx_exception, rate_limited,
                     malformed_json, unsupported_media_type, too_large, timeout, internal,
                     step_up_required, workflow_required, subject_changed]
            message: { type: string }
paths:
  /healthz:
    get: { security: [], summary: Liveness, responses: { '200': { description: ok } } }
  /readyz:
    get: { security: [], summary: Readiness (database reachable), responses: { '200': { description: ready }, '503': { description: not ready } } }
  /v1/journals:
    post:
      summary: Create a DRAFT journal (permission journal.create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JournalCommand' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { type: object, properties: { id: { type: string }, replayed: { type: boolean } } } } } }
        '200': { description: idempotent replay of an identical command }
        '409': { description: idempotency key reused with a different payload }
        '422': { description: validation failure (unbalanced, bad currency, missing fx snapshot...) }
  /v1/journals/{id}:
    get:
      summary: Read a journal (permission journal.read; 404 outside the caller's tenant)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: journal, content: { application/json: { schema: { $ref: '#/components/schemas/Journal' } } } }
        '404': { description: not found }
  /v1/journals/{id}/approve:
    post:
      summary: DRAFT → APPROVED (permission journal.approve; approver ≠ preparer)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: approved journal }, '409': { description: invalid_state or segregation_of_duties } }
  /v1/journals/{id}/post:
    post:
      summary: APPROVED → POSTED (permission journal.post; strict mode requires poster ≠ approver ≠ preparer)
      description: The database re-checks balance, open fiscal period and immutability at COMMIT.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: posted journal }, '409': { description: invalid_state, segregation_of_duties or invariant_violation } }
  /v1/journals/{id}/reverse:
    post:
      summary: Create the DRAFT reversal of a POSTED journal (permission journal.reverse)
      description: The reversal follows the normal approve/post path; posting it marks the original REVERSED atomically.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, reason, business_event_at]
              additionalProperties: false
              properties:
                idempotency_key: { type: string }
                reason: { type: string }
                business_event_at: { type: string, format: date-time, description: Required so that identical retries hash identically }
      responses: { '201': { description: reversal created }, '409': { description: original not posted or already reversed } }
  /v1/fx/snapshots:
    post:
      summary: Record an FX observation (permission fx.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id, source_type, base_currency, quote_currency, rate, rate_type, effective_from_utc, published_at_utc, source_document_hash]
              properties:
                source_id: { type: string, example: NBE }
                source_type: { type: string, enum: [CENTRAL_BANK, COMMERCIAL_BANK, CONTRACT, PROVIDER] }
                base_currency: { type: string }
                quote_currency: { type: string }
                rate: { type: string, description: Quote units per 1 base unit, exact decimal string }
                rate_type: { type: string, enum: [OFFICIAL, COMMERCIAL, CONTRACTUAL, CLOSING, BUDGET] }
                effective_from_utc: { type: string, format: date-time }
                published_at_utc: { type: string, format: date-time }
                source_document_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      responses:
        '201': { description: snapshot recorded with status PENDING (it is never usable before a different person approves it) }
        '400': { description: unknown field — including the removed 0.1.0 `approve` flag }
  /v1/fx/snapshots/{id}/approve:
    post:
      summary: PENDING → APPROVED (permission fx.approve; approver ≠ maker). Outside the source's variance tolerance also fx.approve_exception, MFA and a reason.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: approved; reports deviation and variance_exception }, '401': { description: step_up_required }, '403': { description: forbidden }, '409': { description: invalid_state, segregation_of_duties or workflow_required } }
  /v1/fx/snapshots/{id}/reject:
    post:
      summary: PENDING → REJECTED (permission fx.approve, reason required, not the maker)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: rejected } }
  /v1/fx/snapshots/{id}/withdraw:
    post:
      summary: APPROVED → DISPUTED while no journal line references it (permission fx.approve, reason required)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: withdrawn }, '409': { description: referenced by a journal line } }
  /v1/fx/sources:
    post:
      summary: Register a rate source (permission fx.manage); becomes trusted only when a different person approves it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id, source_type, description]
              properties:
                source_id: { type: string }
                source_type: { type: string, enum: [CENTRAL_BANK, COMMERCIAL_BANK, CONTRACT, PROVIDER] }
                description: { type: string }
                requires_document_hash: { type: boolean, default: true }
                max_variance: { type: string, default: '0.05', description: Relative tolerance against the previous approved rate }
      responses: { '201': { description: PENDING source } }
  /v1/fx/sources/{id}/approve:
    post:
      summary: Approve a source (permission fx.approve; not the registrant)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: APPROVED } }
  /v1/fx/policies:
    post:
      summary: Propose the next version of a legal entity's FX policy (permission fx.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legal_entity_id, rate_type, source_priority, max_staleness_hours]
              properties:
                legal_entity_id: { type: string, format: uuid }
                purpose: { type: string, default: TRANSACTION }
                rate_type: { type: string }
                source_priority: { type: array, items: { type: string } }
                max_staleness_hours: { type: integer }
                allow_inverse: { type: boolean }
      responses: { '201': { description: DRAFT policy version } }
  /v1/fx/policies/{id}/approve:
    post:
      summary: Approve a policy version (permission fx.policy.approve; not the proposer). Journal lines bind the approved policy version.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: APPROVED } }
  /v1/fx/policies/{id}/reject:
    post:
      summary: Reject a policy version (permission fx.policy.approve, reason required)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: REJECTED } }
  /v1/periods/{id}/close:
    post:
      summary: 'Close (or lock) a fiscal period (permission period.close). Prerequisites: integrity scan clean, audit chain intact, no approved-but-unposted journals; the database records the closing trial balance.'
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { lock: { type: boolean } } } } } }
      responses: { '200': { description: closing record (journal count, TB debits/credits, TB hash) }, '409': { description: invalid_state, invariant_violation or workflow_required } }
  /v1/periods/{id}/reopen:
    post:
      summary: Reopen a CLOSED period (permission period.reopen, MFA, reason; not the person who closed it)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: OPEN }, '401': { description: step_up_required }, '409': { description: segregation_of_duties } }
  /v1/workflow/definitions:
    get:
      summary: List definition versions (permission workflow.read)
      responses: { '200': { description: definitions } }
    post:
      summary: Propose a workflow definition version (permission workflow.define). Strictly validated; control-weakening definitions are refused (422).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
      responses: { '201': { description: DRAFT version }, '422': { description: validation (lists every violated rule) } }
  /v1/workflow/definitions/{id}/publish:
    post:
      summary: Publish a DRAFT (permission workflow.publish, MFA, not the author). Retires the previous version of the key.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: PUBLISHED }, '401': { description: step_up_required }, '409': { description: segregation_of_duties or invalid_state } }
  /v1/workflow/definitions/{id}/reject:
    post:
      summary: Reject a DRAFT (permission workflow.publish, reason required)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: REJECTED } }
  /v1/workflow/definitions/{id}/simulate:
    post:
      summary: Dry run of any definition version against a real subject — which steps apply and why. Creates nothing.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [subject_id], properties: { subject_id: { type: string, format: uuid } } } } } }
      responses: { '200': { description: '{ dry_run: true, steps: [...] }' } }
  /v1/workflow/instances:
    get:
      summary: List instances visible to the caller (permission workflow.read; filters status, subject_type, subject_id, overdue=true)
      responses: { '200': { description: instances } }
    post:
      summary: "Start the published version of a definition for a subject (definition's start_permission). One ACTIVE instance per subject. When a mandatory definition governs the subject type only that definition can be started. A journal already APPROVED resumes after the definition's approval step, with its approver excluded wherever the route refers to that step." 
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [definition_key, subject_id], properties: { definition_key: { type: string }, subject_id: { type: string, format: uuid } } } } } }
      responses: { '201': { description: instance with its frozen route and deadlines }, '409': { description: subject not in a startable state or already in a workflow } }
  /v1/workflow/instances/{id}:
    get:
      summary: Instance with decisions and immutable history (permission workflow.read)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: detail }, '404': { description: not found or out of scope } }
  /v1/workflow/instances/{id}/approve:
    post:
      summary: Approve the open step as the caller. When the step's quorum is reached its effect runs in the same transaction, as the caller, through the kernel command.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: decision result (step_completed, effect_executed, approvals, approvals_needed) }, '401': { description: step_up_required }, '403': { description: forbidden }, '409': { description: segregation_of_duties, invalid_state, subject_changed or invariant_violation (effect refused — the decision is not recorded and the failure is counted) } }
  /v1/workflow/instances/{id}/reject:
    post:
      summary: Reject the open step (reason required). Runs the definition's non-sensitive compensation (on_reject) as the caller.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: REJECTED } }
  /v1/workflow/instances/{id}/cancel:
    post:
      summary: Cancel an ACTIVE instance (permission workflow.admin, reason). Never changes the subject.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: CANCELLED } }
  /v1/workflow/tasks:
    get:
      summary: Open steps the caller may decide now (has permission and scope, not excluded by SoD, not yet decided), with deadlines, escalation and failure counts
      responses: { '200': { description: tasks } }
  /v1/workflow/metrics:
    get:
      summary: Console metrics since a time (default 30 days; tenant-wide scope required) — counts by status, overdue, escalated, cycle time avg/p90, first-pass rate, exception rate, decisions per completed instance
      parameters: [{ name: since, in: query, schema: { type: string, format: date-time } }]
      responses: { '200': { description: metrics } }
  /v1/fx/convert:
    post:
      summary: Convert under policy using only approved snapshots knowable at the cutoff (permission fx.read). With legal_entity_id the entity's approved policy is used and the result is binding for journal lines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, target_currency, business_event_at]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                target_currency: { type: string }
                legal_entity_id: { type: string, format: uuid }
                purpose: { type: string }
                business_event_at: { type: string, format: date-time }
                knowledge_cutoff: { type: string, format: date-time, description: Defaults to business_event_at }
                rate_type: { type: string }
                source_priority: { type: array, items: { type: string } }
                allow_inverse: { type: boolean }
                max_staleness_hours: { type: integer }
                rounding: { type: string, enum: [HALF_EVEN, HALF_UP, DOWN, UP] }
      responses:
        '200': { description: conversion bound to a snapshot id and algorithm version }
        '422': { description: fx_exception — no approved rate (never a fabricated one) }
  /v1/budgets/revisions:
    post:
      summary: Create a DRAFT budget revision or original budget baseline (budget.revise)
      responses: { '201': { description: created } }
  /v1/budgets/transfers:
    post:
      summary: Request an inter-cost-code budget transfer (budget.transfer)
      responses: { '201': { description: created } }
  /v1/budgets/drawdowns:
    post:
      summary: Request a contingency drawdown (budget.revise)
      responses: { '201': { description: created } }
  /v1/projects/{id}/budget:
    get:
      summary: Get project budget current position by cost code (original, revisions, transfers, drawdowns, current)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: budget current positions } }
  /v1/meta/roles:
    get:
      summary: Role catalogue (roles and their permissions; no people or data), for the console's page guides
      responses: { '200': { description: roles } }
  /v1/authority/matrices:
    post:
      summary: Prepare an authority matrix version with its approval bands (authority.manage)
      responses: { '201': { description: created DRAFT } }
  /v1/authority/matrices/{id}/{action}:
    post:
      summary: submit (author), approve or reject (authority.approve, fresh MFA, a different person); approval retires the matrix in force
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: action, in: path, required: true, schema: { type: string, enum: [submit, approve, reject] } }]
      responses: { '200': { description: ok }, '403': { description: forbidden or segregation of duties } }
  /v1/authority/matrix:
    get:
      summary: The authority matrix in force (null when none)
      responses: { '200': { description: matrix with rules } }
  /v1/delegations:
    get:
      summary: Delegations you lent or received (all, for delegation.approve)
      responses: { '200': { description: delegations } }
    post:
      summary: Lend part of your own authority to a colleague for at most 90 days (delegation.create)
      responses: { '201': { description: created DRAFT }, '403': { description: permission not held or never delegable } }
  /v1/delegations/{id}/{action}:
    post:
      summary: submit (delegator), approve or reject (delegation.approve, fresh MFA, neither delegator nor delegate), revoke (delegator or approver, with a reason)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: action, in: path, required: true, schema: { type: string, enum: [submit, approve, reject, revoke] } }]
      responses: { '200': { description: ok } }
  /v1/sod/exceptions:
    post:
      summary: Prepare a duty-conflict exception for one person under a written control (authority.manage)
      responses: { '201': { description: created DRAFT }, '422': { description: the pair is not a listed conflict } }
  /v1/sod/exceptions/{id}/{action}:
    post:
      summary: submit, approve or reject a duty-conflict exception (approval needs authority.approve and fresh MFA)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: action, in: path, required: true, schema: { type: string, enum: [submit, approve, reject] } }]
      responses: { '200': { description: ok } }
  /v1/sod/report:
    get:
      summary: Duty conflicts present in the role catalogue (authority.manage, authority.approve or audit.read)
      responses: { '200': { description: conflicts } }
  /v1/dashboard:
    get:
      summary: Financial control dashboard (tiles with value, level, formula, source, drill-down link and contributors). Query preset=executive|project|finance|procurement, entity_id
      responses: { '200': { description: tiles the caller may read, plus hidden tiles and what they need }, '404': { description: entity not visible } }
  /v1/dashboard/kpis:
    get:
      summary: The KPI catalogue (id, title, formula, source, thresholds) and the role presets
      responses: { '200': { description: kpis } }
  /v1/reports/catalogue:
    get:
