name: ci
# workflow_dispatch: lets the same revision be run again without a new commit (release-candidate repeatability).
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with: { go-version: "1.26.11" }
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: The CI result gate rejects what it must (its own tests)
        run: python3 tools/ci/test_check_test_results.py
      - name: AURA tokens meet their contrast targets and the stylesheet matches them
        run: python3 tools/design/aura_contrast.py --check-css
      - name: Completion register keeps its baseline and its evidence exists
        run: python3 tools/final_completion.py --check

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned to immutable commits (resolved with git ls-remote 2026-10-21).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with: { go-version: "1.26.11", cache: false }
      # SC-12 gate: go.sum was computed from official source mirrors in an
      # environment without access to sum.golang.org. Re-derive it here with
      # the public checksum database and fail on any difference.
      - name: Verify go.sum against sum.golang.org
        run: |
          cp go.sum /tmp/go.sum.committed
          rm go.sum
          GOFLAGS=-mod=mod GONOSUMDB= GOSUMDB=sum.golang.org go mod tidy
          diff -u /tmp/go.sum.committed go.sum
          go mod verify
      - name: Vulnerability scan (fails on reachable vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: SBOM (CycloneDX)
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0 mod -licenses -json -output sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sbom, path: sbom.cdx.json }
      - name: Local supply-chain checks (go mod verify, build-list SBOM, licenses, secret scan)
        run: OUT=supply-chain-out scripts/supply_chain_local.sh
      - name: Gate status audit
        run: python3 tools/gate_status.py

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4
        env: { POSTGRES_PASSWORD: ci-only-throwaway-password, POSTGRES_DB: serk_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with: { go-version: "1.26.11" }
      - name: Cluster roles
        run: PGPASSWORD=ci-only-throwaway-password psql -h localhost -U postgres -d serk_ci -v ON_ERROR_STOP=1 -f deploy/00-roles.sql
      # Real services for the document security tests (ADR 0019). Nothing here
      # is optional: the result gate below rejects the run if any test is
      # skipped, so a service that fails to start fails the job.
      - name: Start an S3-compatible store (MinIO, built from source at a pinned version) and a ClamAV daemon
        run: |
          # Credentials for this run only, generated here: nothing secret is in the repository.
          S3_ACCESS="ci$(openssl rand -hex 8)"; S3_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$S3_SECRET"
          echo "SERK_TEST_S3_ACCESS_KEY=$S3_ACCESS" >> "$GITHUB_ENV"
          echo "SERK_TEST_S3_SECRET_KEY=$S3_SECRET" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP" && GOFLAGS=-mod=mod GOBIN="$RUNNER_TEMP/bin" go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c)
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER="$S3_ACCESS" MINIO_ROOT_PASSWORD="$S3_SECRET" nohup "$RUNNER_TEMP/bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/minio/health/live
      - name: Provision the test bucket and prove it is private (authenticated create, write/read, anonymous and wrong-secret refusal)
        env:
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: serk-test-e3b0c44298fc
        run: S3_ACCESS_KEY="$SERK_TEST_S3_ACCESS_KEY" S3_SECRET_KEY="$SERK_TEST_S3_SECRET_KEY" go run ./tools/ci/s3provision
      - name: The ClamAV daemon answers, with its engine and signature database version
        run: |
          set -o pipefail
          # Ask the daemon itself (PING/VERSION over its socket), not just the TCP port: Docker accepts connections before clamd is ready.
          for i in $(seq 1 150); do
            if docker exec clamav clamdscan --ping 1 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec clamav clamdscan --ping 1
          docker exec clamav clamdscan --version | tee clamav-version.txt
          docker exec clamav sh -c 'sigtool --info /var/lib/clamav/daily.c?d | grep -E "^(Build time|Version|Signatures)"' | tee -a clamav-version.txt
      # Browser journeys: Playwright pinned to the version the journeys were written against, with its matching Chromium.
      - name: Install Playwright 1.63.0 and Chromium
        run: |
          node --version
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --save-exact playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "SERK_PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Unit + PostgreSQL integration/adversarial/concurrency tests (race detector), as structured results
        env:
          SERK_TEST_ADMIN_DSN: postgres://postgres:ci-only-throwaway-password@localhost:5432/serk_ci?sslmode=disable
          SERK_TEST_CLAMD: 127.0.0.1:3310
          SERK_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          SERK_TEST_S3_BUCKET: serk-test-e3b0c44298fc
        run: |
          mkdir -p test-logs
          # No pipe: the exit status is go test's own and is handed to the gate, which decides from the JSON events.
          rc=0
          go test -race -count=1 -p 1 -json ./... > test-logs/test-run.json || rc=$?
          python3 tools/ci/check_test_results.py test-logs/test-run.json --mandatory tools/ci/mandatory_tests.txt \
            --go-exit "$rc" --min-pass 469 --summary test-logs/test-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-logs
          path: |
            test-logs/test-run.json
            test-logs/test-summary.json
            clamav-version.txt
      - name: Production configuration refuses demo defaults
        run: go test -count=1 -run 'Manifest|Demo|ProductionRules' ./internal/config/
      - name: Build binaries
        run: CGO_ENABLED=0 go build -trimpath ./cmd/...

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Docker images (production, and the development tools from their own file)
        run: |
          docker build -f deploy/Dockerfile -t serk:latest .
          docker build -f deploy/Dockerfile.devtools -t serk:devtools .
      - name: The production image contains no development tool
        run: |
          id=$(docker create serk:latest)
          docker export "$id" | tar -t > image-files.txt
          docker rm "$id" > /dev/null
          ! grep -E '(^|/)serk-(seed|devtoken|import)$' image-files.txt
      - name: Scan the production image for known vulnerabilities (fails on fixable HIGH or CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress serk:latest

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Secret scan of the whole history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --no-banner --exit-code 1

  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The console's scripts parse (the seven browser journeys are mandatory in the test job)
        run: |
          # The console's scripts are ES modules: check them as modules. A plain `node --check app.js` accepted a
          # syntax error in this file (it failed only in the browser journey).
          for f in internal/webui/static/*.js; do node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }; done
          for f in e2e/*.mjs; do node --check "$f"; done
